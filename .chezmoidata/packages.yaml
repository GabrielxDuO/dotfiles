packages:
  darwin:
    homebrew:
      tap:
        - 'oven-sh/bun'
      brew:
        - 'git'
        - 'fzf' # https://github.com/junegunn/fzf#using-homebrew
        - 'zoxide' # https://github.com/ajeetdsouza/zoxide#installation
        - 'starship' # https://starship.rs/zh-CN/guide/#%E6%AD%A5%E9%AA%A4-1-%E5%AE%89%E8%A3%85-starship
        - 'thefuck' # https://github.com/nvbn/thefuck#installation
        - 'neovim' # https://neovim.io/doc/install/#homebrew-on-macos-or-linux
        - 'oven-sh/bun/bun' # https://github.com/oven-sh/homebrew-bun#install
        - 'deno' # https://docs.deno.com/runtime/getting_started/installation/#download-and-install
        - 'bat' # https://github.com/sharkdp/bat#on-macos-or-linux-via-homebrew
        - 'eza' # https://eza.rocks/#brew-macos
        - 'rmtrash' # https://github.com/TBXark/rmtrash#homebrew
        - 'fd' # https://github.com/sharkdp/fd#on-macos
        - 'jless' # https://github.com/PaulJuliusMartinez/jless#installation
        - 'jq' # https://formulae.brew.sh/formula/jq
        - 'ripgrep' # https://github.com/BurntSushi/ripgrep#installation
        - 'tealdeer' # https://formulae.brew.sh/formula/tealdeer
        - 'tmux' # https://github.com/tmux/tmux/wiki/Installing#binary-packages
        - 'wget' # https://formulae.brew.sh/formula/wget
        - 'curl' # https://formulae.brew.sh/formula/curl
        - 'ffmpeg'
        - 'sevenzip' # yazi required
        - 'poppler' # yazi required
        - 'resvg' # yazi required
        - 'imagemagick'
        - 'yazi' # https://github.com/sxyazi/yazi#installation
        - 'git-delta' # https://dandavison.github.io/delta/installation.html#installation
        - 'neovim' # https://neovim.io/doc/install/#homebrew-on-macos-or-linux
      cask:
        - 'kitty'
        - 'karabiner-elements'
        - 'hammerspoon' # https://github.com/Hammerspoon/hammerspoon#homebrew
        - 'snipaste'
        - 'claude-code' # https://code.claude.com/docs/en/overview#homebrew
        - 'localsend'
        - 'bluesnooze'
        - 'coteditor'
        - 'font-symbols-only-nerd-font'
        - 'font-jetbrains-maple-mono-nf'
        - 'font-maple-mono-nf-cn'
        - 'font-ibm-plex-mono'
