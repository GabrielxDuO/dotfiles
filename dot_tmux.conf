# According to `https://linux.die.net/man/1/tmux`
# `bind` is the alias of `bind-key`
# `set` is the alias of `set-option`
# `setw` is the alias of `set-window-option`


# ============================================================================ #
# region Non-plugin options
# ============================================================================ #
# True colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start pane/window numbers at 1 to match keyboard order with tmux order
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse control
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Make tmux selection act like vi
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection # start selecting text with "v"
bind -T copy-mode-vi C-v send -X rectangle-toggle # start selecting text with <C-v>
bind -T copy-mode-vi y send -X copy-selection-and-cancel # copy text with "y"

# Do not rename windows automatically
set -g allow-rename off

# OSC52 clipboard
set -s set-clipboard on
set -as terminal-features ',xterm-kitty:clipboard'
set -as terminal-features ',tmux-256color:clipboard'
# endregion


# ============================================================================ #
# region Key bindings
# ============================================================================ #
# <prefix>:list-keys to show key bindings
# Remap <prefix> from <C-b> to <C-a>
unbind C-b
set -g prefix C-a
# <prefix> + <C-a> to send <prefix> internally (took over by tmux-sensible)
# bind C-a send-prefix

# <prefix> + <C-l> to send <C-l> internally (no need to set when <C-l> is not occupied) (took over by vim-tmux-navigator)
# bind C-l send C-l

# <prefix> + <r> to reload configuration
bind r source-file ~/.tmux.conf \; display-message "Configuration Reloaded"

# Split panes with <|> and <-> in cwd
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate among panes with vim style (took over by vim-tmux-navigator)
# bind j select-pane -D
# bind k select-pane -U
# bind h select-pane -L
# bind l select-pane -R

# Resize panes
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
# endregion


# ============================================================================ #
# region Tmux plugin
# ============================================================================ #
# https://github.com/tmux-plugins/tpm#installation
# Use <prefix> + I to install plugins
# set -g @plugin 'tmux-plugins/tpm' # (installed manually with git)
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
# persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
# automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'
# endregion


# ============================================================================ #
# region Catppuccin Mocha theme
# ============================================================================ #
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"

# Status left
set -g status-left-length 100
set -g status-left ""

# Status window
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status right
set -g status-right-length 100
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
# endregion


# ============================================================================ #
# region Tmux resurrect configs
# ============================================================================ #
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
# endregion


# ============================================================================ #
# region Initialize TMUX plugin manager
# ============================================================================ #
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# endregion
